# The Home Assistant add-on repository descriptor.
#
# The name is what Supervisor prints as the SECTION HEADING in the add-on
# store, above the add-ons this repository contains. It no longer needs a
# "fork" suffix: upstream's repository is called EchoMuse and this one is
# called Revoice, so somebody who has both added sees two distinct headings
# rather than two identical ones. That distinction is not cosmetic —
# add-ons from different repositories get different slugs and therefore
# different /data, so installing the wrong one starts with an empty
# database and a freshly generated CA that no fielded device will verify.
name: "Revoice"
url: "https://github.com/FelixTechgiti/Revoice"
maintainer: "FelixTechgiti"
